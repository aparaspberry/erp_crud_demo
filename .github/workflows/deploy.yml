name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Docker Image
        run: |
          docker build -t erp-crud-demo:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d -p 5000:5000 --name test-container erp-crud-demo:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:5000/health
          docker stop test-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          docker tag erp-crud-demo:${{ github.sha }} ghcr.io/${REPO_LOWER}:latest
          docker tag erp-crud-demo:${{ github.sha }} ghcr.io/${REPO_LOWER}:${{ github.sha }}

          docker push ghcr.io/${REPO_LOWER}:latest
          docker push ghcr.io/${REPO_LOWER}:${{ github.sha }}